apiVersion: v1
kind: Secret
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ include "platform.secretValue" (dict "ctx" $ "secret" "gateway" "key" "api-key" "value" (printf "urk_%s" (randAlphaNum 40))) }}
---
# Upstream credentials. Copied from the owning namespace at install/upgrade time,
# because a pod can only reference Secrets in its own namespace.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-upstreams
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
type: Opaque
data:
{{- range .Values.upstreams }}
{{- if .fromSecret }}
{{- $src := lookup "v1" "Secret" .fromSecret.namespace .fromSecret.name }}
{{- if and $src $src.data (hasKey $src.data .fromSecret.key) }}
  {{ .slug }}: {{ index $src.data .fromSecret.key }}
{{- else if not $.Values.allowMissingUpstreamSecrets }}
{{- fail (printf "upstream %s: Secret %s/%s key %s not found; install that release first" .slug .fromSecret.namespace .fromSecret.name .fromSecret.key) }}
{{- end }}
{{- end }}
{{- end }}
