{{- $existing := lookup "v1" "Secret" .Release.Namespace "gateway" }}
{{- $existingData := ($existing | default dict).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "platform.secretValue" (dict "ctx" $ "secret" "gateway" "key" "admin-password" "value" (randAlphaNum 20)) }}
  session-secret: {{ include "platform.secretValue" (dict "ctx" $ "secret" "gateway" "key" "session-secret" "value" (randAlphaNum 48)) }}
  # Encrypts upstream credentials at rest. Losing it makes stored credentials unreadable.
  credential-key: {{ include "platform.secretValue" (dict "ctx" $ "secret" "gateway" "key" "credential-key" "value" (randAlphaNum 48)) }}
  {{- if .Values.llm.apiKey }}
  llm-api-key: {{ .Values.llm.apiKey | b64enc }}
  {{- else if hasKey $existingData "llm-api-key" }}
  llm-api-key: {{ index $existingData "llm-api-key" }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "platform.secretValue" (dict "ctx" $ "secret" "postgres" "key" "password" "value" (randAlphaNum 32)) }}
---
# Upstream credentials. Copied from the owning namespace at install/upgrade time,
# because a pod can only reference Secrets in its own namespace.
apiVersion: v1
kind: Secret
metadata:
  name: gateway-upstreams
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
type: Opaque
data:
{{- range .Values.upstreams }}
{{- if .fromSecret }}
{{- $src := lookup "v1" "Secret" .fromSecret.namespace .fromSecret.name }}
{{- if and $src $src.data (hasKey $src.data .fromSecret.key) }}
  {{ .slug }}: {{ index $src.data .fromSecret.key }}
{{- else if not $.Values.allowMissingUpstreamSecrets }}
{{- fail (printf "upstream %s: Secret %s/%s key %s not found; install that release first" .slug .fromSecret.namespace .fromSecret.name .fromSecret.key) }}
{{- end }}
{{- end }}
{{- end }}
