{{- if and .Values.global.tls.enabled .Values.global.tls.redirectHttp }}
# Traefik-specific: Traefik is the Ingress controller on both k3d and k3s.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "ingress") | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
