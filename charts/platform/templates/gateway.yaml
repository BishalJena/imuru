apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
spec:
  selector: {{- include "platform.selectorLabels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
spec:
  # One replica: MCP sessions live in process memory.
  replicas: 1
  selector:
    matchLabels: {{- include "platform.selectorLabels" (dict "ctx" $ "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 8 }}
      annotations:
        checksum/upstreams: {{ toJson .Values.upstreams | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
            # $(VAR) expansion: Kubernetes substitutes the Secret-sourced env var above.
            - name: DATABASE_URL
              value: postgres://gateway:$(POSTGRES_PASSWORD)@postgres:5432/gateway
            - name: PUBLIC_URL
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.global.tls.enabled) (include "platform.host" .) | quote }}
            - name: SELF_MCP_URL
              value: http://127.0.0.1:8080/mcp
            - name: ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: gateway, key: admin-password }
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: gateway, key: session-secret }
            - name: CREDENTIAL_KEY
              valueFrom:
                secretKeyRef: { name: gateway, key: credential-key }
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: CHAT_MAX_STEPS
              value: {{ .Values.llm.maxSteps | quote }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: gateway, key: llm-api-key, optional: true }
            {{- if .Values.provisioner.enabled }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: gateway, key: internal-token }
            - name: MAX_STORES_PER_USER
              value: {{ .Values.provisioner.maxStoresPerUser | quote }}
            {{- end }}
            - name: UPSTREAM_ALLOWED_HOSTS
              value: {{ join "," .Values.gateway.upstreamAllowedHosts | quote }}
            - name: UPSTREAM_TIMEOUT_MS
              value: {{ .Values.gateway.upstreamTimeoutMs | quote }}
            - name: UPSTREAM_CONNECT_TIMEOUT_MS
              value: {{ .Values.gateway.connectTimeoutMs | quote }}
            - name: ALLOWED_HOSTS
              value: {{ printf "%s,gateway,gateway.%[2]s,gateway.%[2]s.svc,gateway.%[2]s.svc.cluster.local,localhost,127.0.0.1" (include "platform.host" .) .Release.Namespace | quote }}
            - name: HEALTH_INTERVAL_MS
              value: {{ .Values.gateway.healthIntervalMs | quote }}
            {{- range .Values.upstreams }}
            {{- if ne (.auth | default "none") "none" }}
            - name: {{ include "platform.upstreamEnvName" . }}
              valueFrom:
                secretKeyRef: { name: gateway-upstreams, key: {{ .slug }}, optional: true }
            {{- end }}
            {{- end }}
            - name: SEED_UPSTREAMS
              value: {{ include "platform.seedUpstreams" . | quote }}
          # Host header set explicitly: kubelet would send the pod IP, which the allowlist rejects.
          # Readiness = database reachable. Upstream health is reported per server, not via probes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              httpHeaders: [{ name: Host, value: localhost }]
            periodSeconds: 20
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels: {{- include "platform.labels" (dict "ctx" $ "component" "gateway") | nindent 4 }}
  {{- if and .Values.global.tls.enabled .Values.global.tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.global.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.global.tls.enabled }}
  tls:
    - hosts: [{{ include "platform.host" . }}]
      secretName: app-tls
  {{- end }}
  rules:
    - host: {{ include "platform.host" . }}
      http:
        paths:
          {{- range list "/mcp" "/api" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
          {{- end }}
          # Longest prefix wins, so everything else is the dashboard.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
