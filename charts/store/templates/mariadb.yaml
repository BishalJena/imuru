apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels: {{- include "store.labels" (dict "ctx" $ "component" "mariadb") | nindent 4 }}
spec:
  # Headless: the StatefulSet's governing Service. One replica, so the name resolves to that pod.
  clusterIP: None
  selector: {{- include "store.selectorLabels" (dict "ctx" $ "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels: {{- include "store.labels" (dict "ctx" $ "component" "mariadb") | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "store.selectorLabels" (dict "ctx" $ "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" (dict "ctx" $ "component" "mariadb") | nindent 8 }}
    spec:
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: mariadb, key: password }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mariadb, key: root-password }
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          # healthcheck.sh authenticates as the healthcheck@localhost user the image
          # creates on first init, so probes never need the root password.
          startupProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [healthcheck.sh, --connect, --innodb_initialized]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [healthcheck.sh, --connect]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "store.labels" (dict "ctx" $ "component" "mariadb") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "store.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
