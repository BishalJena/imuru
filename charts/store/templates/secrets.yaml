# Generated once, then read back with lookup on every upgrade. `keep` stops
# `helm uninstall` from deleting them: the MariaDB volume outlives the release,
# and a regenerated password would no longer match the data on it.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb
  labels: {{- include "store.labels" (dict "ctx" $ "component" "mariadb") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  root-password: {{ include "store.secretValue" (dict "ctx" $ "secret" "mariadb" "key" "root-password" "value" (randAlphaNum 32)) }}
  password: {{ include "store.secretValue" (dict "ctx" $ "secret" "mariadb" "key" "password" "value" (randAlphaNum 32)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress
  labels: {{- include "store.labels" (dict "ctx" $ "component" "wordpress") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ include "store.secretValue" (dict "ctx" $ "secret" "wordpress" "key" "admin-password" "value" (randAlphaNum 24)) }}
  {{- range $k := list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
  {{ $k }}: {{ include "store.secretValue" (dict "ctx" $ "secret" "wordpress" "key" $k "value" (randAscii 64)) }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: woo-rest
  labels: {{- include "store.labels" (dict "ctx" $ "component" "wordpress") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  consumer-key: {{ include "store.secretValue" (dict "ctx" $ "secret" "woo-rest" "key" "consumer-key" "value" (printf "ck_%s" (randAlphaNum 40 | sha1sum))) }}
  consumer-secret: {{ include "store.secretValue" (dict "ctx" $ "secret" "woo-rest" "key" "consumer-secret" "value" (printf "cs_%s" (randAlphaNum 40 | sha1sum))) }}
