server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The SPA calls only its own origin; the gateway sits behind the same host.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Hashed asset names: cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Client-side routes (/servers, /invite/<token>, ...) all serve the app shell.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }
}
